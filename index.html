/* Concepto: revista digital de una sola columna estrecha, con rótulos pequeños en Poppins y titulares grandes en Scholar cursiva. Negro y crema como base; lima solo en acciones y etiquetas; naranja solo en puntos y marcas. */
:root{
  --bg:#FBF8F4; --fg:#020202; --muted:#58534C; --rule:rgba(2,2,2,.16); --panel:#F2EDE4;
  --inv-bg:#020202; --inv-fg:#FBF8F4; --inv-muted:#B5AFA4;
  --lime:#C1FF72; --on-lime:#020202; --orange:#FF751F; --orange-ink:#B2400A;
  --danger:#B3261E; --ok:#1E6B34; --focus:#020202;
  --display:"Scholar",Georgia,"Times New Roman",serif;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#020202; --fg:#FBF8F4; --muted:#ABA498; --rule:rgba(251,248,244,.2); --panel:#101010;
  --inv-bg:#FBF8F4; --inv-fg:#020202; --inv-muted:#55504A; --orange-ink:#FF751F;
  --danger:#FF8F86; --ok:#8BE0A4; --focus:#C1FF72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#020202; --fg:#FBF8F4; --muted:#ABA498; --rule:rgba(251,248,244,.2); --panel:#101010;
  --inv-bg:#FBF8F4; --inv-fg:#020202; --inv-muted:#55504A; --orange-ink:#FF751F;
  --danger:#FF8F86; --ok:#8BE0A4; --focus:#C1FF72; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:1rem;line-height:1.7;font-weight:400;
  padding-block:0 4rem;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
.wrap{width:100%}
main>*{max-width:44rem;margin-inline:auto}
main>.mirada{max-width:none;margin-inline:calc(-1*max(var(--gut),env(safe-area-inset-left,0px)))}
.display{font-family:var(--display);font-style:italic;font-weight:400;letter-spacing:-.01em;text-wrap:balance}
.ic{width:1.15em;height:1.15em;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lbl{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}

/* Navegación */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--rule);
  margin-inline:calc(-1*max(var(--gut),env(safe-area-inset-left,0px)));padding-inline:max(var(--gut),env(safe-area-inset-left,0px))}
.nav-in{max-width:44rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:3.25rem}
.nav .brand{font-family:var(--display);font-style:italic;font-weight:700;font-size:1rem;text-decoration:none;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav ul{display:flex;gap:.1rem;flex:none}
.nav a.tab,.nav button.tab{display:inline-flex;align-items:center;min-height:2.5rem;padding:0 .6rem;border:0;background:none;
  font-size:.78rem;font-weight:500;text-decoration:none;cursor:pointer;border-radius:99px;color:var(--muted)}
.nav .tab[aria-current="page"]{color:var(--on-lime);background:var(--lime)}
.nav .tab:hover{color:var(--fg)}
.nav .tab[aria-current="page"]:hover{color:var(--on-lime)}

/* Portada de edición */
.mast{padding-block:2.25rem 0}
.ribbon{display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1.5rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--orange);flex:none}
.mast-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.mast h1{font-size:clamp(2.7rem,12.5vw,5rem);line-height:.95;font-weight:700;text-transform:uppercase;letter-spacing:-.015em}
.mast h1 span{display:block}
.mast h1 .amp{font-weight:400;color:var(--orange-ink)}
.radar{width:clamp(3.5rem,16vw,5.5rem);height:auto;flex:none;color:var(--fg);margin-top:.35rem}
.sub{margin-top:1.4rem;font-size:1.05rem;font-weight:500;line-height:1.5;max-width:32rem}
.meta{margin-top:1.75rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:1rem 1.25rem;padding-block:1.1rem;border-block:1px solid var(--fg)}
.meta div{min-width:0}
.meta dt{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meta dd{font-size:.92rem;font-weight:500;line-height:1.4;margin-top:.15rem}
.notice{margin-top:1.25rem;padding:.85rem 1rem;background:var(--panel);border-left:3px solid var(--orange);font-size:.85rem;line-height:1.55}
.notice strong{font-weight:600}
.notice.warn{border-left-color:var(--orange)}

.intro{margin-top:2.5rem}
.intro .eyebrow{color:var(--orange-ink)}
.intro h2{font-size:clamp(1.9rem,7.5vw,2.7rem);line-height:1.1;font-weight:700;margin-top:.6rem}
.intro .tema{margin-top:.9rem;font-size:.9rem;color:var(--muted);font-weight:500}
.read{margin-top:1.2rem;display:grid;gap:1rem}
.read p{font-size:1.04rem;line-height:1.8}
.read p:first-child::first-letter{font-family:var(--display);font-weight:700;font-size:3.6em;float:left;line-height:.85;padding:.08em .1em 0 0}
.rich p+p,.rich p+ul,.rich ul+p{margin-top:.8rem}
.rich ul{display:grid;gap:.5rem;margin-top:.8rem}
.rich li{position:relative;padding-left:1.25rem}
.rich li::before{content:"";position:absolute;left:0;top:.8em;width:.5rem;height:1.5px;background:var(--orange)}
.rich .step{display:block}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-top:3.5rem;padding-top:.9rem;border-top:1px solid var(--fg)}
.sec-h h2{font-size:1.9rem;font-weight:700;line-height:1.1}
.sec-h .lbl{color:var(--muted)}

/* Tarjetas de noticia */
.card{padding-block:2rem;border-bottom:1px solid var(--rule)}
.card:first-of-type{padding-top:1.5rem}
.card-top{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.num{font-size:2.6rem;line-height:1;font-weight:700;color:var(--orange-ink);min-width:1.6rem}
.chip{display:inline-flex;align-items:center;min-height:1.65rem;padding:0 .7rem;border-radius:99px;background:var(--lime);color:var(--on-lime);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;min-height:1.65rem;padding:0 .7rem;border-radius:99px;border:1px solid var(--fg);font-size:.7rem;font-weight:500;letter-spacing:.04em}
.pill.pend{border-style:dashed;border-color:var(--orange-ink);color:var(--orange-ink)}
.card h2{font-size:clamp(1.65rem,6.6vw,2.2rem);line-height:1.14;font-weight:700;margin-top:1rem}
.cmeta{margin-top:.7rem;font-size:.82rem;font-weight:500;color:var(--muted);line-height:1.5}
.cover{display:block;width:100%;max-height:20rem;object-fit:cover;margin-top:1.1rem}
.sum{margin-top:1rem;font-size:1.02rem;line-height:1.75}
.src{margin-top:.8rem;font-size:.8rem;color:var(--muted)}
.src a{font-weight:500;color:var(--fg);text-underline-offset:3px}
.src .pending{color:var(--orange-ink);font-weight:500}
.open-btn{margin-top:1.2rem;display:inline-flex;align-items:center;gap:.6rem;min-height:2.9rem;padding:0 1.15rem;border:1.5px solid var(--fg);background:none;border-radius:99px;font-size:.88rem;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.open-btn:hover{background:var(--fg);color:var(--bg)}
.open-btn .ic{transition:transform .25s}
.open-btn[aria-expanded="true"] .ic{transform:rotate(45deg)}
.card-body{margin-top:1.4rem;border-top:1px solid var(--fg)}
.acc{border-bottom:1px solid var(--rule)}
.acc>button{display:flex;align-items:center;gap:.85rem;width:100%;min-height:3.5rem;padding:.6rem 0;border:0;background:none;text-align:left;cursor:pointer}
.acc .k{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px solid var(--fg);font-size:.72rem;font-weight:600;flex:none}
.acc .t{flex:1;font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;line-height:1.35}
.acc .ic{transition:transform .25s}
.acc>button[aria-expanded="true"] .ic{transform:rotate(180deg)}
.acc>button[aria-expanded="true"] .k{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.acc-p{padding:.2rem 0 1.6rem 2.75rem}
.acc-p.rich{font-size:1rem;line-height:1.8}
.mins{display:inline-flex;align-items:center;gap:.4rem;margin-bottom:.9rem;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:2.9rem;padding:0 1.2rem;border-radius:99px;border:1.5px solid var(--fg);background:none;font-size:.86rem;font-weight:600;text-decoration:none;cursor:pointer;line-height:1.2;transition:background .2s,color .2s,transform .15s}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.pri:hover{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.sm{min-height:2.4rem;padding:0 .9rem;font-size:.8rem}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:var(--bg)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover,.btn[aria-disabled="true"]:hover{background:none;color:inherit}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}

/* Mirada de Tiby */
.mirada{margin-top:3.5rem;margin-inline:calc(-1*max(var(--gut),env(safe-area-inset-left,0px)));padding:2.75rem max(var(--gut),env(safe-area-inset-left,0px)) 3rem;background:var(--inv-bg);color:var(--inv-fg)}
.mirada-in{max-width:44rem;margin:0 auto}
.mirada .lbl{color:var(--inv-muted);display:flex;align-items:center;gap:.6rem}
.mirada h2{font-size:clamp(1.9rem,8vw,2.9rem);line-height:1.1;font-weight:700;margin-top:1.1rem}
.mirada .rich{margin-top:1.4rem;font-size:1.04rem;line-height:1.85;color:var(--inv-fg)}
.mirada .sign{margin-top:1.6rem;font-family:var(--display);font-style:italic;font-weight:700;font-size:1.3rem}

/* Reto */
.reto{margin-top:3.5rem;padding:1.6rem 1.25rem;border:1.5px solid var(--fg)}
.reto h2{font-size:clamp(1.8rem,7vw,2.4rem);line-height:1.1;font-weight:700}
.reto .q{margin-top:1.1rem;font-family:var(--display);font-style:italic;font-weight:700;font-size:1.45rem;line-height:1.3}
.steps{margin-top:1.1rem;display:grid;gap:.55rem;counter-reset:s}
.steps li{position:relative;padding-left:2.1rem;counter-increment:s;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;left:0;top:.1em;width:1.45rem;height:1.45rem;border-radius:50%;background:var(--fg);color:var(--bg);font-size:.72rem;font-weight:600;display:grid;place-items:center}
.check{display:flex;align-items:center;gap:.8rem;margin-top:1.5rem;min-height:2.75rem;cursor:pointer;font-weight:500}
.check input{appearance:none;-webkit-appearance:none;width:1.6rem;height:1.6rem;border:1.5px solid var(--fg);border-radius:6px;display:grid;place-items:center;margin:0;cursor:pointer;flex:none;background:none}
.check input:checked{background:var(--lime);border-color:var(--lime)}
.check input:checked::after{content:"";width:.9rem;height:.5rem;border-left:2.5px solid var(--on-lime);border-bottom:2.5px solid var(--on-lime);transform:translateY(-1px) rotate(-45deg)}
.field{display:grid;gap:.4rem;margin-top:1.1rem}
.field>label,.field>.fl{font-size:.8rem;font-weight:600;letter-spacing:.02em}
.help{font-size:.78rem;color:var(--muted);line-height:1.5;font-weight:400}
.inp,select.inp,textarea.inp{width:100%;min-height:2.9rem;padding:.6rem .85rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--bg);font-size:.95rem;line-height:1.5}
.inp:hover{border-color:var(--muted)}
.inp:focus{border-color:var(--fg);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 35%,transparent)}
textarea.inp{resize:vertical;min-height:6rem}

function rich(text) {
  var out = '';
  String(text || '').split(/\n{2,}/).forEach(function (blk) {
    var lines = blk.split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return;
    var i = 0, para = [];
    function flushP() { if (para.length) { out += '<p>' + para.map(esc).join('<br>') + '</p>'; para = []; } }
    while (i < lines.length) {
      if (/^\s*-\s+/.test(lines[i])) {
        flushP();
        var items = [];
        while (i < lines.length && /^\s*-\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*-\s+/, '')); i++; }
        out += '<ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      } else { para.push(lines[i]); i++; }
    }
    flushP();
  });
  return out;
}

function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2600);
}
function copyText(text, okMsg) {
  function fallback() {
    try {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
      document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); document.body.removeChild(ta);
      toast(ok ? okMsg : 'No pude copiar automáticamente. Selecciona el texto y cópialo.');
    } catch (e) { toast('No pude copiar automáticamente. Selecciona el texto y cópialo.'); }
  }
  try { navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback); } catch (e) { fallback(); }
}

function parseHash(h) {
  h = String(h || '').replace(/^#/, '');
  if (!h) return { v: 'home' };
  if (h === 'archivo') return { v: 'archive' };
  if (h === 'admin') return { v: 'admin' };
  var m = /^ed-(.+)-n(\d+)$/.exec(h);
  if (m) return { v: 'news', id: m[1], n: +m[2] };
  m = /^ed-(.+)$/.exec(h);
  if (m) return { v: 'ed', id: m[1] };
  return { v: 'home' };
}

function validate(ed, forPublish) {
  var errs = [], warns = [];
  if (!ed.fecha) errs.push('Indica la fecha de la edición.');
  if (!String(ed.titulo).trim()) errs.push('Escribe el título de la edición.');
  ed.noticias.forEach(function (n, i) {
    var p = 'Noticia ' + (i + 1) + ': ';
    if (words(n.resumen) > 70) errs.push(p + 'el resumen tiene ' + words(n.resumen) + ' palabras y el máximo es 70.');
    if (n.fuenteUrl && !safeUrl(n.fuenteUrl)) errs.push(p + 'el enlace de la fuente debe empezar con http:// o https://.');
    if (!n.fuenteUrl || !n.verificada) warns.push(p + 'fuente pendiente de verificar.');
    if (!n.fecha) warns.push(p + 'sin fecha de anuncio (se mostrará como tendencia general).');
  });
  if (forPublish) {
    if (!String(ed.intro).trim()) errs.push('Escribe la introducción editorial.');
    if (ed.noticias.length < 3 || ed.noticias.length > 5) errs.push('Una edición debe tener entre 3 y 5 noticias (tiene ' + ed.noticias.length + ').');
    ed.noticias.forEach(function (n, i) {
      var p = 'Noticia ' + (i + 1) + ': ';
      if (!String(n.titular).trim()) errs.push(p + 'falta el titular.');
      if (!String(n.empresa).trim()) errs.push(p + 'falta la empresa, tecnología o sector.');
      if (!String(n.resumen).trim()) errs.push(p + 'falta el resumen.');
      if (!String(n.quePaso).trim()) errs.push(p + 'falta ¿Qué pasó?.');
      if (!String(n.marca).trim()) errs.push(p + 'falta el análisis para marca personal.');
      if (!String(n.empresaImpacto).trim()) errs.push(p + 'falta el análisis para empresa.');
      var m = +n.practica.min; if (!(m >= 5 && m <= 15)) errs.push(p + 'el ejercicio debe durar entre 5 y 15 minutos.');
      if (!String(n.practica.texto).trim()) errs.push(p + 'falta el ejercicio de Ponlo en práctica.');
    });
    if (!String(ed.mirada.texto).trim()) errs.push('Escribe La mirada de Tiby.');
    if (!String(ed.reto.pregunta).trim()) errs.push('Escribe la pregunta del reto.');
    if (!ed.reto.pasos.length) errs.push('Agrega al menos un paso al reto.');

  return { errs: errs, warns: warns };
}

  var sec = root.querySelector('[data-reto]'); if (!sec) return;
  var id = sec.getAttribute('data-reto'), cb = document.getElementById('reto-done'), tx = document.getElementById('reto-text'), st = document.getElementById('reto-saved');
  function save() { var ok = lsSet('radar:reto:' + id, { done: cb.checked, text: tx.value }); if (st) st.innerHTML = ok ? ' <span class="saved">' + ic('check') + 'Guardado en este dispositivo</span>' : ' Tu navegador no permite guardar aquí; copia tu respuesta para conservarla.'; }
  cb.addEventListener('change', save); tx.addEventListener('input', function () { clearTimeout(bindReto._t); bindReto._t = setTimeout(save, 400); });
}

/* ---------- publicar ---------- */
function buildDoc() {
  var css = document.getElementById('css').textContent, app = document.getElementById('app').textContent;
  var data = JSON.stringify(DATA).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
    HEAD + '<style id="css">' + css + '</style><div id="root"></div><script id="data" type="application/json">' + data + '<\/script><script id="app">' + app + '<\/script></body></html>';
}
function saveToSite(msg, after) {
  return claude.use('artifact').then(function (art) {
    if (!art) throw { code: 'not_granted' };
    ssSet('radar:after', JSON.stringify({ msg: msg || 'Cambios guardados en el sitio', route: after || 'admin' }));
    return art.publish(buildDoc());
  }).then(function () { state.dirty = false; }, function (err) {
    ssDel('radar:after');
    var c = err && err.code;
    if (c === 'conflict') toast('Alguien guardó cambios antes. La página se actualizará.');
    else if (c === 'not_writer' || c === 'not_granted' || c === 'capability_disabled') toast('No tienes permiso para guardar cambios en esta plataforma.');
    else if (c === 'too_large') toast('La página es demasiado grande. Quita imágenes pesadas.');
    else toast('No se pudo guardar. Inténtalo de nuevo en un momento.');
    throw err;
  });
}
function commitDraft() {
  var d = state.adm.draft, i = -1;
  DATA.editions.forEach(function (e, k) { if (e.id === d.id) i = k; });
  var copy = clone(d); copy.noticias.forEach(function (n) { n.practica.min = +n.practica.min || 10; });
  if (/^\d+$/.test(String(copy.numero))) copy.numero = +copy.numero;
  if (i > -1) DATA.editions[i] = copy; else DATA.editions.push(copy);
}

/* ---------- eventos ---------- */
function setPath(o, path, v) { var p = path.split('.'), k; for (var i = 0; i < p.length - 1; i++) o = o[p[i]]; k = p[p.length - 1]; o[k] = v; }

root.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'f-q') { state.q = t.value; var res = document.getElementById('arch-res'); if (res) res.innerHTML = archiveListHTML(); return; }
  if (t.dataset && t.dataset.f) fieldChange(t);
});
root.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'f-date') { state.date = t.value; var res = document.getElementById('arch-res'); if (res) res.innerHTML = archiveListHTML(); return; }
  if (t.dataset && t.dataset.f) fieldChange(t);
  if (t.dataset && t.dataset.img !== undefined && t.files && t.files[0]) readImage(t.files[0], +t.dataset.img);
});
function fieldChange(t) {
  var path = t.dataset.f, kind = t.dataset.kind, v;
  if (path.indexOf('settings.') === 0) { DATA.settings[path.slice(9)] = t.value.trim(); state.dirty = true; return; }
  if (kind === 'bool') v = t.checked; else if (kind === 'int') v = t.value === '' ? '' : +t.value; else if (kind === 'lines') v = t.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); else v = t.value;
  setPath(state.adm.draft, path, v);
  if (t.dataset.count) { var c = document.getElementById(t.id + '-c'), w = words(t.value); if (c) { c.textContent = w + ' / ' + t.dataset.count + ' palabras'; c.classList.toggle('over', w > +t.dataset.count); } }
}
function readImage(file, i) {
  if (!/^image\//.test(file.type)) { toast('Elige un archivo de imagen.'); return; }
  var fr = new FileReader();
  fr.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 1000, s = Math.min(1, max / img.width), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      state.adm.draft.noticias[i].imagen = cv.toDataURL('image/jpeg', 0.8); render(); toast('Imagen cargada');
    };
    img.onerror = function () { toast('No se pudo leer esa imagen.'); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

root.addEventListener('click', function (ev) {
  var a = ev.target.closest('a[data-go]');
  if (a && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); go(a.getAttribute('data-go')); return; }
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act, ad = state.adm;
  switch (act) {
    case 'card': {
      var body = b.nextElementSibling, open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open); body.hidden = !open; b.querySelector('span').textContent = open ? 'Cerrar análisis' : 'Abrir análisis'; break;
    }
    case 'sec': {
      var p = b.nextElementSibling, o = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', o); p.hidden = !o; break;
    }
    case 'copy-link': copyText(linkFor(b.dataset.h), 'Enlace copiado'); break;
    case 'copy-ej': {
      var ed = findEd(b.dataset.ed) || ad.draft, n = ed.noticias.filter(function (x) { return x.nid === +b.dataset.n; })[0];
      copyText('Ponlo en práctica (' + n.practica.min + ' min)\n' + n.titular + '\n\n' + n.practica.texto, 'Ejercicio copiado'); break;
    }
    case 'copy-reto': {
      var e3 = findEd(b.dataset.ed) || ad.draft, tx = document.getElementById('reto-text'), dn = document.getElementById('reto-done');
      copyText('Tu acción de hoy · Radar IA & Negocios\n' + e3.reto.pregunta + '\n\nHecho: ' + (dn && dn.checked ? 'sí' : 'no') + '\nMi reflexión: ' + (tx && tx.value.trim() ? tx.value.trim() : '(sin reflexión)'), 'Respuesta copiada'); break;
    }
    case 'cat': state.cat = state.cat === b.dataset.c ? '' : b.dataset.c; render(); break;
    case 'clear-filters': state.q = ''; state.cat = ''; state.date = ''; render(); break;
    /* admin */
    case 'adm-tab': ad.view = b.dataset.v; ad.confirm = ''; render(); break;
    case 'confirm': ad.confirm = b.dataset.v; render(); break;
    case 'new-ed': ad.draft = newEdition(); ad.view = 'edit'; ad.errs = []; ad.warns = []; ad.openN = { 1: true }; state.route = { v: 'admin' }; render(); window.scrollTo(0, 0); break;
    case 'edit-ed': ad.draft = clone(findEd(b.dataset.id)); ad.draft.noticias.forEach(function (n) { n.practica = n.practica || { min: 10, texto: '' }; }); ad.view = 'edit'; ad.errs = []; ad.warns = validate(ad.draft, false).warns; ad.openN = {}; render(); window.scrollTo(0, 0); break;
    case 'del-ed': DATA.editions = DATA.editions.filter(function (e) { return e.id !== b.dataset.id; }); ad.confirm = ''; state.dirty = true; render(); toast('Edición eliminada. Guarda en el sitio para confirmarlo.'); break;
    case 'adm-back': ad.view = 'list'; ad.draft = null; ad.confirm = ''; render(); window.scrollTo(0, 0); break;
    case 'ntoggle': { var nid = +b.dataset.nid; ad.openN[nid] = !ad.openN[nid]; var nb = b.nextElementSibling; nb.hidden = !ad.openN[nid]; b.setAttribute('aria-expanded', !!ad.openN[nid]); break; }
    case 'nadd': { var mx = 0; ad.draft.noticias.forEach(function (n) { if (n.nid > mx) mx = n.nid; }); var nn = blankNews(mx + 1); ad.draft.noticias.push(nn); ad.openN[nn.nid] = true; render(); break; }
    case 'ndel': ad.draft.noticias.splice(+b.dataset.i, 1); ad.confirm = ''; render(); break;
    case 'nmove': { var i = +b.dataset.i, j = i + (+b.dataset.d), arr = ad.draft.noticias; if (j >= 0 && j < arr.length) { var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } render(); break; }
    case 'img-del': ad.draft.noticias[+b.dataset.i].imagen = null; render(); break;
    case 'preview': { var v0 = validate(ad.draft, false); if (v0.errs.length) { ad.errs = v0.errs; ad.warns = v0.warns; render(); window.scrollTo(0, 0); break; } state.route = { v: 'preview' }; render(); window.scrollTo(0, 0); break; }
    case 'back-edit': state.route = { v: 'admin' }; render(); break;
    case 'save-ed': case 'publish-ed': case 'unpublish': {
      var pub = act === 'publish-ed', v = validate(ad.draft, pub || (ad.draft.estado === 'publicada' && act === 'save-ed'));
      ad.errs = v.errs; ad.warns = v.warns;
      if (v.errs.length) { render(); window.scrollTo(0, 0); break; }
      if (pub) ad.draft.estado = 'publicada'; if (act === 'unpublish') ad.draft.estado = 'borrador';
      commitDraft(); state.dirty = true;
      b.disabled = true;
      saveToSite(pub ? 'Edición publicada. Ya aparece en la portada si es la más reciente.' : act === 'unpublish' ? 'Edición retirada. Quedó como borrador.' : 'Guardado en el sitio.', 'admin').catch(function () { b.disabled = false; render(); });
      break;
    }
    case 'save-site': case 'save-settings': b.disabled = true; saveToSite('Cambios guardados en el sitio.', 'admin').catch(function () { b.disabled = false; }); break;
    case 'backup': copyText(JSON.stringify(DATA, null, 1), 'Copia de seguridad copiada'); break;
  }
});

/* ---------- arranque ---------- */
(function boot() {
  var h = ''; try { h = location.hash; } catch (e) {}
  state.route = parseHash(h);
  var after = ssGet('radar:after');
  if (after) { ssDel('radar:after'); try { after = JSON.parse(after); } catch (e) { after = null; } }
  render();
  if (after) { state.route = parseHash(after.route); render(); toast(after.msg); }
  if (window.claude && claude.use) {
    claude.use('user').then(function (u) { return u ? u.canEdit() : false; }).then(function (ok) { state.canEdit = !!ok; }, function () { state.canEdit = false; })
    .then(function () { if (state.canEdit || state.route.v === 'admin') render(); });
  } else { state.canEdit = false; }
})();
})();
